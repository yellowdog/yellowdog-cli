# user_id = "ocid1.user.oc1..."         # required
# fingerprint = "..."                   # required
# private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"  # required: the PEM text, inline (or in '''...''' with its lines as they are)

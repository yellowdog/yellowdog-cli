[build-system]
    requires = ["setuptools>=61.2"]
    build-backend = "setuptools.build_meta"

[project]
    name = "yellowdog-cli"
    description = "Python-based CLI for the YellowDog Platform"
    classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Operating System :: OS Independent",
        "Development Status :: 4 - Beta",
    ]
    requires-python = ">=3.10"
    dynamic = ["version"]
    license = "Apache-2.0"
    dependencies = [
        "PyPAC >= 0.16.4",
        "dateparser",
        "fastjsonschema",
        "python-dotenv",
        "requests",
        "rclone-api",
        "rich >= 13.9.4",
        "tabulate >= 0.9.0",
        "tomli >= 2.4.1",
        "yellowdog-sdk >= 15.6.0",
    ]

[[project.authors]]
    name = "YellowDog Limited"
    email = "support@yellowdog.co"

[project.readme]
    file = "PYPI_README.md"
    content-type = "text/markdown"

[project.urls]
    Homepage = "https://github.com/yellowdog/yellowdog-cli"
    Changelog = "https://github.com/yellowdog/yellowdog-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
    jsonnet = ["jsonnet"]
    commander = ["PyQt6"]
    mcp = ["mcp>=2.2"]
    cloudwizard = [
        "boto3",
        "botocore",
        "google-cloud-compute",
        "google-cloud-storage",
        "azure-identity",
        "azure-mgmt-resource",
        "azure-mgmt-network",
        "azure-mgmt-storage",
        "azure-mgmt-subscription",
    ]
    dev = [
        "cli-test-helpers",
        "pre-commit",
        "pytest",
        "pytest-cov",
        "pytest-xdist",
        "python-dispatch",
        "ruff",
        "pyright",
        "tox",
        "tox-uv",
        "twine",
    ]

[project.scripts]
    yd-abort = "yellowdog_cli.abort:main"
    yd-application = "yellowdog_cli.application:main"
    yd-boost = "yellowdog_cli.boost:main"
    yd-cancel = "yellowdog_cli.cancel:main"
    yd-copy = "yellowdog_cli.copy:main"
    yd-cloudwizard = "yellowdog_cli.cloudwizard:main"
    yd-commander = "yellowdog_cli.commander.launcher:main"
    yd-compare = "yellowdog_cli.compare:main"
    yd-compute-restart = "yellowdog_cli.compute_restart:main"
    yd-compute-start = "yellowdog_cli.compute_start:main"
    yd-compute-stop = "yellowdog_cli.compute_stop:main"
    yd-create = "yellowdog_cli.create:main"
    yd-delete = "yellowdog_cli.delete:main"
    yd-doctor = "yellowdog_cli.doctor:main"
    yd-download = "yellowdog_cli.download:main"
    yd-finish = "yellowdog_cli.finish:main"
    yd-follow = "yellowdog_cli.follow:main"
    yd-format-json = "yellowdog_cli.format_json:main"
    yd-help = "yellowdog_cli.help:main"
    yd-hold = "yellowdog_cli.hold:main"
    yd-instantiate = "yellowdog_cli.instantiate:main"
    yd-jsonnet2json = "yellowdog_cli.jsonnet2json:main"
    yd-list = "yellowdog_cli.list:main"
    yd-nodeaction = "yellowdog_cli.nodeaction:main"
    yd-ls = "yellowdog_cli.ls:main"
    yd-mcp = "yellowdog_cli.mcp.launcher:main"
    yd-provision = "yellowdog_cli.provision:main"
    yd-remove = "yellowdog_cli.remove:main"
    yd-resize = "yellowdog_cli.resize:main"
    yd-schema = "yellowdog_cli.schema:main"
    yd-show = "yellowdog_cli.show:main"
    yd-shutdown = "yellowdog_cli.shutdown:main"
    yd-start = "yellowdog_cli.start:main"
    yd-submit = "yellowdog_cli.submit:main"
    yd-terminate = "yellowdog_cli.terminate:main"
    yd-upload = "yellowdog_cli.upload:main"
    yd-variables = "yellowdog_cli.variables:main"
    yd-version = "yellowdog_cli.version:main"
    yd-wait = "yellowdog_cli.wait:main"

[tool.setuptools]
    include-package-data = false
    packages = [
        "yellowdog_cli",
        "yellowdog_cli.utils",
        "yellowdog_cli.utils.cloudwizard",
        "yellowdog_cli.utils.dataclient",
        "yellowdog_cli.utils.specs",
        "yellowdog_cli.commander",
        "yellowdog_cli.mcp",
        "yellowdog_cli.spec_data",
    ]

[tool.setuptools.package-data]
    "yellowdog_cli.commander" = ["*.ui", "images/*", "README.md"]
    "yellowdog_cli.mcp" = ["README.md"]
    "yellowdog_cli.spec_data" = ["*.json"]

[tool.setuptools.dynamic.version]
    attr = "yellowdog_cli._version.__version__"

[tool.ruff]
    target-version = "py310"
    line-length = 88

[tool.ruff.lint]
    select = ["E", "F401", "I", "RUF", "UP", "W"]
    ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
    # Commander's tests call tests/qt_guard.py's require_qt() before importing
    # anything that pulls in Qt, so that a node without Qt's runtime libraries
    # skips them rather than failing to collect. That is necessarily a statement
    # ahead of the imports, which is what E402 reports.
    "tests/test_commander_*.py" = ["E402"]
    "tests/test_gui_harness.py" = ["E402"]
    "tests/gui_harness.py" = ["E402"]
    "tests/commander_dialogs.py" = ["E402"]

[tool.coverage.run]
    # Branches as well as lines: the untested paths worth finding are mostly
    # failure branches, which a line taken on the way past hides
    branch = true
    source = ["yellowdog_cli"]

[tool.coverage.report]
    skip_covered = true
    show_missing = true

[tool.pytest.ini_options]
    # Under pytest-xdist ('-n'), tests marked with one xdist_group run on one
    # worker: those sharing state no test can isolate (see
    # test_commander_file_preview.py); ignored without '-n'
    addopts = "--dist=loadgroup"
    filterwarnings = [
      "ignore::DeprecationWarning:pydispatch",
    ]

[tool.pyright]
    pythonVersion = "3.10"
    typeCheckingMode = "basic"

[tool.tox]
    env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
    runner = "uv-venv-runner"
    extras = ["dev", "commander", "mcp"]
    commands = [["pytest", "{posargs}"]]

[tool.tox.env.py315]
    description = "pre-release; excluded from the default run, see DEVELOPMENT.md"

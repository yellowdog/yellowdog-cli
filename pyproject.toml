[build-system]
    requires = ["setuptools>=61.2"]
    build-backend = "setuptools.build_meta"

[project]
    name = "yellowdog-cli"
    description = "Python-based CLI for the YellowDog Platform"
    classifiers = [
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Operating System :: OS Independent",
        "Development Status :: 4 - Beta",
    ]
    requires-python = ">=3.10"
    dynamic = ["version"]
    license = "Apache-2.0"
    dependencies = [
        "PyPAC >= 0.16.4",
        "dateparser",
        "python-dotenv",
        "requests",
        "rclone-api",
        "rich >= 13.9.4",
        "tabulate >= 0.9.0",
        "tomli >= 2.4.1",
        "yellowdog-sdk >= 15.4.2",
    ]

[[project.authors]]
    name = "YellowDog Limited"
    email = "support@yellowdog.co"

[project.readme]
    file = "PYPI_README.md"
    content-type = "text/markdown"

[project.urls]
    Homepage = "https://github.com/yellowdog/yellowdog-cli"

[project.optional-dependencies]
    jsonnet = ["jsonnet"]
    commander = ["PyQt6"]
    cloudwizard = [
        "boto3",
        "botocore",
        "google-cloud-compute",
        "google-cloud-storage",
        "azure-identity",
        "azure-mgmt-resource",
        "azure-mgmt-network",
        "azure-mgmt-storage",
        "azure-mgmt-subscription",
    ]
    dev = [
        "cli-test-helpers",
        "pre-commit",
        "pytest",
        "pytest-xdist",
        "python-dispatch",
        "ruff",
        "pyright",
        "tox",
        "tox-uv",
        "twine",
    ]

[project.scripts]
    yd-abort = "yellowdog_cli.abort:main"
    yd-application = "yellowdog_cli.application:main"
    yd-boost = "yellowdog_cli.boost:main"
    yd-cancel = "yellowdog_cli.cancel:main"
    yd-copy = "yellowdog_cli.copy:main"
    yd-cloudwizard = "yellowdog_cli.cloudwizard:main"
    yd-commander = "yellowdog_cli.commander.launcher:main"
    yd-compare = "yellowdog_cli.compare:main"
    yd-compute-restart = "yellowdog_cli.compute_restart:main"
    yd-compute-start = "yellowdog_cli.compute_start:main"
    yd-compute-stop = "yellowdog_cli.compute_stop:main"
    yd-create = "yellowdog_cli.create:main"
    yd-delete = "yellowdog_cli.delete:main"
    yd-rm = "yellowdog_cli.delete:main"
    yd-download = "yellowdog_cli.download:main"
    yd-finish = "yellowdog_cli.finish:main"
    yd-follow = "yellowdog_cli.follow:main"
    yd-format-json = "yellowdog_cli.format_json:main"
    yd-help = "yellowdog_cli.help:main"
    yd-hold = "yellowdog_cli.hold:main"
    yd-instantiate = "yellowdog_cli.instantiate:main"
    yd-jsonnet2json = "yellowdog_cli.jsonnet2json:main"
    yd-list = "yellowdog_cli.list:main"
    yd-nodeaction = "yellowdog_cli.nodeaction:main"
    yd-ls = "yellowdog_cli.ls:main"
    yd-provision = "yellowdog_cli.provision:main"
    yd-remove = "yellowdog_cli.remove:main"
    yd-resize = "yellowdog_cli.resize:main"
    yd-show = "yellowdog_cli.show:main"
    yd-shutdown = "yellowdog_cli.shutdown:main"
    yd-start = "yellowdog_cli.start:main"
    yd-submit = "yellowdog_cli.submit:main"
    yd-terminate = "yellowdog_cli.terminate:main"
    yd-upload = "yellowdog_cli.upload:main"
    yd-version = "yellowdog_cli.version:main"
    yd-wait = "yellowdog_cli.wait:main"

[tool.setuptools]
    include-package-data = false
    packages = ["yellowdog_cli", "yellowdog_cli.utils", "yellowdog_cli.commander"]

[tool.setuptools.package-data]
    "yellowdog_cli.commander" = ["*.ui", "images/*"]

[tool.setuptools.dynamic.version]
    attr = "yellowdog_cli._version.__version__"

[tool.ruff]
    target-version = "py310"
    line-length = 88

[tool.ruff.lint]
    select = ["E", "F401", "I", "RUF", "UP", "W"]
    ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
    # commander.py is lifted from the standalone yellow-gui demo (a separate
    # repo); these are pre-existing findings in the original, not introduced
    # by the relocation. Suppressed here rather than reformatted, to keep the
    # diff against the source limited to the documented path decoupling.
    "yellowdog_cli/commander/commander.py" = ["E402", "RUF005"]

[tool.pytest.ini_options]
    filterwarnings = [
      "ignore::DeprecationWarning:pydispatch",
    ]

[tool.pyright]
    pythonVersion = "3.10"
    typeCheckingMode = "basic"

[tool.tox]
    env_list = ["py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
    runner = "uv-venv-runner"
    extras = ["dev", "commander"]
    commands = [["pytest", "{posargs}"]]
